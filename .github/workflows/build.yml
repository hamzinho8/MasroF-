name: Build MasroF APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build with Gradle
        # On utilise 'gradle' directement car le runner ubuntu l'a pré-installé
        # Cela évite les erreurs de permission ou d'absence du wrapper (gradlew)
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MasroF-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
