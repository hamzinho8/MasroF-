name: Android Build & Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Web App (Vite)
        run: npm run build

      - name: Sync Capacitor with Android
        run: |
          npx cap sync android
          # Explicit clean to ensure no stale artifacts
          cd android && ./gradlew clean

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true # Disable cache to avoid 400 errors and ensure clean state

      - name: Expert Android Environment Repair
        run: |
          cd android
          # Force regeneration of a CLEAN wrapper with a VALID stable version
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          sed -i 's/\r$//' gradlew
          
          # Inject ultimate stability properties for GitHub Actions
          # Focus: Memory conservation and error resilience
          cat > gradle.properties <<EOF
          org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=false
          android.enableAapt2WorkerProcessResurrection=true
          android.useAndroidX=true
          android.enableJetifier=true
          # Disable some features that consume memory in CI
          org.gradle.vfs.watch=false
          org.gradle.configureondemand=false
          EOF

      - name: Build Android Debug APK
        run: |
          cd android
          # --no-daemon is critical for CI memory management
          ./gradlew assembleDebug --no-daemon --stacktrace --info

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Optional: Build Release APK (Unsigned)
      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
