name: Android Build & Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Web App (Vite)
        run: npm run build

      - name: Install Capacitor CLI
        run: npm install @capacitor/cli @capacitor/core @capacitor/android

      - name: Sync Capacitor with Android
        run: npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Fix/Verify Gradle Wrapper
        run: |
          cd android
          # Remove potentially corrupted JAR
          rm -f gradle/wrapper/gradle-wrapper.jar
          # Regenerate proper wrapper using system gradle on runner
          gradle wrapper
          chmod +x gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          # Try to build, if it fails due to wrapper, the debug info above will tell us why.
          # We don't want to run 'gradle wrapper' every time as it requires gradle installed on runner,
          # but the ubuntu-latest runner HAS gradle. However, we should trust the wrapper if it's there.
          ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Optional: Build Release APK (Unsigned)
      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
