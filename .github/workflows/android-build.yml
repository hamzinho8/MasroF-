name: Android Capacitor Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build Web
        run: npm run build

      - name: Capacitor Sync
        run: npx cap sync android

      - name: Install manual Gradle (Bypass Wrapper)
        run: |
          wget https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip gradle-8.11.1-bin.zip
          sudo mv gradle-8.11.1 /opt/gradle
          echo "/opt/gradle/bin" >> $GITHUB_PATH

      - name: Verify Gradle Installation
        run: gradle -v

      - name: Build Debug APK
        run: |
          cd android
          gradle assembleDebug --stacktrace --warning-mode all

      - name: Build Release AAB
        run: |
          cd android
          gradle bundleRelease --stacktrace --warning-mode all

      - name: Debug Output Files
        run: |
          echo "Looking for APK files:"
          find android -name "*.apk"
          echo "Looking for AAB files:"
          find android -name "*.aab"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
