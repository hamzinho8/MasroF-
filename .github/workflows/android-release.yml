name: Android Release Build
# Updated to trigger Github modifications

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
            
      - name: Find gradlew and build APK
        run: |
          GRADLE_PATH=$(find . -name "gradlew" -exec dirname {} \;)
          cd "$GRADLE_PATH"
          chmod +x ./gradlew
          echo "Cleaning project..."
          ./gradlew clean
          echo "Building debug APK..."
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: masrof-app-debug
          path: '**/app/build/outputs/apk/debug/*.apk'
