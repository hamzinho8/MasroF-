name: Android Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Fix Gradle Wrapper
        run: |
          cd android
          mkdir -p gradle/wrapper
          wget -qO gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew
          sed -i 's/\r$//' gradlew
          if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            sed -i 's/\r$//' gradle/wrapper/gradle-wrapper.properties
          fi

      - name: Install npm dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor Android
        run: |
          npx cap sync android
          cd android
          
          # Fix memory and performance for GitHub Actions runner
          cat > gradle.properties <<EOF
          org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=false
          android.useAndroidX=true
          android.enableJetifier=true
          EOF
          
          ./gradlew clean --no-daemon

      - name: Build Android APK (Debug)
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon --stacktrace --info

      - name: Build Android AAB (Release)
        working-directory: ./android
        run: ./gradlew bundleRelease --no-daemon --stacktrace --info

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release.aab
          path: android/app/build/outputs/bundle/release/app-release.aab
