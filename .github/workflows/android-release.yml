name: Android Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        run: |
          # On cherche où est le fichier gradlew et on entre dans ce dossier
          GRADLE_PATH=$(find . -name gradlew -exec dirname {} \;)
          cd $GRADLE_PATH
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MasroF-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
