name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build web
        run: npm run build

      - name: Capacitor Sync
        run: npx cap sync android

      - name: Grant permission
        run: chmod +x android/gradlew

      - name: Check wrapper files
        run: |
          ls -la android/gradle/wrapper/
          file android/gradle/wrapper/gradle-wrapper.jar

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --warning-mode all

      - name: Find APK
        run: find android -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
