name: Final APK Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Project
        run: npm run build

      - name: Capacitor Sync
        run: npx cap sync android

      - name: Fix Android Project (Final Fix)
        run: |
          # 1. Ajouter la couleur manquante slate_50
          # On l'ajoute dans le fichier colors.xml du module app
          sed -i '/<\/resources>/i \    <color name="slate_50">#F8FAFC</color>' app/src/main/res/values/colors.xml
          
          cd android
          # 2. Forcer la version du SDK à 36 pour satisfaire les dépendances
          sed -i 's/compileSdkVersion = 34/compileSdkVersion = 36/g' variables.gradle
          sed -i 's/targetSdkVersion = 34/targetSdkVersion = 36/g' variables.gradle
          
          # 3. Réparer le Gradle Wrapper corrompu
          rm -f gradle/wrapper/gradle-wrapper.jar
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Masrof-Final-APK
          path: android/app/build/outputs/apk/debug/*.apk
