name: 🎨 Générer Icônes Android

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: 'URL de l''image source (PNG carré)'
        required: true
        default: 'https://i.postimg.cc/V6Q0Fv9k/icone.png'

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-icons:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Cloner le repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 📚 Installer les dépendances
        run: |
          npm install sharp --save-dev

      - name: 🎨 Générer les icônes
        run: |
          node scripts/generate-icons.js
        env:
          IMAGE_URL: ${{ github.event.inputs.image_url }}

      - name: 🔧 Configurer Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: 🌿 Créer ou basculer vers la branche feature
        run: |
          git checkout -b feature/icons || git checkout feature/icons
          git pull origin feature/icons || true

      - name: 📤 Ajouter et pousser les changements
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "🎨 Mise à jour automatique des icônes Android - $(date)"
            git push origin feature/icons -f
            echo "✅ Changements poussés vers la branche feature/icons"
          else
            echo "ℹ️ Aucun changement à commiter"
          fi

      - name: ✅ Succès!
        run: |
          echo "✅ Workflow complété!"
          echo "📋 Les fichiers ont été poussés vers la branche 'feature/icons'"
          echo "🔗 Créez une PR manuellement: https://github.com/hamzinho8/MasroF-/compare/main...feature/icons"
