name: 🎨 Générer Icônes Android

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: 'URL de l''image source (PNG carré)'
        required: true
        default: 'https://i.postimg.cc/V6Q0Fv9k/icone.png'

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-icons:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Cloner le repository
        uses: actions/checkout@v4

      - name: 📦 Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 📚 Installer les dépendances
        run: |
          npm install sharp axios --save-dev

      - name: 🎨 Générer les icônes
        run: |
          node scripts/generate-icons.js
        env:
          IMAGE_URL: ${{ github.event.inputs.image_url }}

      - name: 📤 Créer une Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: '🎨 Mise à jour automatique des icônes Android'
          title: '🎨 Icônes Android générées automatiquement'
          body: |
            ## 📦 Fichiers générés automatiquement
            
            - ✅ Splash screens (mdpi, hdpi, xhdpi, xxhdpi, xxxhdpi)
            - ✅ Icônes mipmap (tous les formats)
            - ✅ Icônes notification (monochrome)
            - ✅ Images sources téléchargées
            
            Veuillez vérifier et merger si tout est correct! 🚀
          branch: feature/auto-icons-${{ github.run_number }}
          delete-branch: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ✅ Succès!
        run: echo "✅ Workflow complété! Vérifiez les Pull Requests pour merger les changements."
